version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - VECTOR_STORE_BACKEND=memory
      - WAREHOUSE_BACKEND=local_warehouse
      - PUBSUB_BACKEND=local_async
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  event-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      - ENVIRONMENT=production
      - PUBSUB_BACKEND=local_async
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    depends_on:
      - api

