apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-intelligence-platform
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: us-central1-docker.pkg.dev/enterprise-intelligence-prod/platform-repo/api:latest
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: VECTOR_STORE_BACKEND
          value: "pinecone"
        - name: PINECONE_INDEX_NAME
          value: "enterprise-knowledge-index"
        - name: EMBEDDING_BACKEND
          value: "vertex"
        - name: GCP_PROJECT_ID
          value: "enterprise-intelligence-prod"
        - name: WAREHOUSE_BACKEND
          value: "bigquery"
        - name: PUBSUB_BACKEND
          value: "pubsub"
        ports:
        - containerPort: 8080

